<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroGlass ERP - Glass Company Management System</title>
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- CSV & Excel Parsing Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
  <!-- Toast System -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Grid Layout -->
  <div id="app-container" class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo">
          <i data-lucide="layers" class="logo-icon"></i>
        </div>
        <div class="brand-text">
          <h1>AeroGlass</h1>
          <span>ERP Platform</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="#projects" class="nav-item" data-view="projects">
          <i data-lucide="kanban-square"></i>
          <span>Projects & Tasks</span>
        </a>
        <a href="#hr" class="nav-item" data-view="hr">
          <i data-lucide="users"></i>
          <span>HR Management</span>
        </a>
        <a href="#inventory" class="nav-item" data-view="inventory">
          <i data-lucide="package"></i>
          <span>Inventory Store</span>
        </a>
        <a href="#gatepass" class="nav-item" data-view="gatepass">
          <i data-lucide="file-check-2"></i>
          <span>Gate Pass</span>
        </a>
        <a href="#users" class="nav-item" data-view="users">
          <i data-lucide="shield-alert"></i>
          <span>User Control</span>
        </a>
        <a href="#settings" class="nav-item" data-view="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="avatar" id="user-avatar">AD</div>
          <div class="user-info">
            <span class="user-name" id="profile-name">Admin</span>
            <span class="user-role" id="profile-role">System Admin</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Content Workspace -->
    <main class="workspace">
      <!-- Header -->
      <header class="workspace-header">
        <div class="header-search">
          <h2 id="view-title">Dashboard</h2>
        </div>

        <div class="header-actions">
          <!-- Connection Sync Indicators -->
          <div class="sync-indicator offline" id="sync-indicator">
            <span class="indicator-dot"></span>
            <span class="indicator-label" id="sync-label">Offline</span>
          </div>

          <!-- Quick Theme Toggle -->
          <button id="theme-toggle" class="header-btn" title="Toggle Theme">
            <i data-lucide="sun" id="theme-icon-sun" class="hidden"></i>
            <i data-lucide="moon" id="theme-icon-moon"></i>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div id="view-content" class="view-content">
        <!-- Views will be dynamically injected here by JS modules -->
      </div>
    </main>
  </div>



  <!-- Global Modal Container -->
  <div id="global-modal" class="modal-overlay hidden">
    <div class="modal-container glass-card" id="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Custom module modal elements -->
      </div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
