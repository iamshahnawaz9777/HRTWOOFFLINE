<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroGlass ERP E2E Test Suite Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --bg-gradient: linear-gradient(135deg, #090a0f 0%, #121520 100%);
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.06);
      --panel-bg: rgba(20, 24, 38, 0.6);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --primary: #3b82f6;
      --accent: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 30px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      height: calc(100vh - 60px);
    }

    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; height: auto; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 16px;
    }

    .test-cases-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 8px;
    }

    .test-case-item {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .test-case-item.running {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
      background: rgba(59, 130, 246, 0.02);
    }

    .test-case-item.passed {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.02);
    }

    .test-case-item.failed {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.02);
    }

    .test-name {
      font-size: 14px;
      font-weight: 600;
    }

    .test-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .test-status-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
    .badge-running { background: rgba(59, 130, 246, 0.15); color: var(--primary); animation: blink 1s infinite alternate; }
    .badge-passed { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-failed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    @keyframes blink {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex-grow: 1;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%); color: white; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .iframe-label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left panel: Test cases report -->
    <div class="panel">
      <h1>AeroGlass E2E Testing Console</h1>
      <p class="subtitle">Real-time browser-native integration E2E automation checks</p>

      <div class="test-cases-list" id="test-list">
        <!-- Generated Dynamically -->
      </div>

      <div class="controls">
        <button id="run-tests-btn" class="btn btn-primary">Start Automated Integration E2E Audit</button>
      </div>
    </div>

    <!-- Right panel: Live iframe app -->
    <div class="iframe-wrapper">
      <div class="iframe-label">Target Sandbox Viewport: index.html</div>
      <iframe src="index.html" id="target-iframe"></iframe>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('target-iframe');
    const runBtn = document.getElementById('run-tests-btn');
    const testListEl = document.getElementById('test-list');

    // Test cases definition
    const testCases = [
      {
        id: "t1",
        name: "IndexedDB Auto-Initialization",
        desc: "Ensures the AeroGlass IndexedDB initializes and populates all 10 databases cleanly.",
        run: async (win) => {
          if (!win.db || !win.db.db) throw new Error("IndexedDB database is null.");
          const stores = Array.from(win.db.db.objectStoreNames);
          const required = ["users", "projects", "tasks", "employees", "attendance", "leaves", "inventory", "transactions", "gatepasses", "syncQueue"];
          const missing = required.filter(st => !stores.includes(st));
          if (missing.length > 0) throw new Error(`Missing stores: ${missing.join(', ')}`);
          return "Loaded database stores: " + stores.length;
        }
      },
      {
        id: "t2",
        name: "Dashboard Home Rendering & KPI Widgets",
        desc: "Checks that the home view renders active projects, inventory stock, and pending gate pass metrics.",
        run: async (win) => {
          win.location.hash = "#dashboard";
          await sleep(800);
          
          const doc = win.document;
          const kpis = doc.querySelectorAll('.kpi-card');
          if (kpis.length !== 4) throw new Error(`Expected 4 metric widgets, found ${kpis.length}`);
          
          const titles = Array.from(doc.querySelectorAll('.kpi-info h3')).map(e => e.textContent.trim());
          if (!titles.includes("ACTIVE PROJECTS") || !titles.includes("LOW STOCK ALERTS")) {
            throw new Error(`Metric titles mismatch: ${titles.join(', ')}`);
          }
          return "Home View fully loaded with 4 metric cards.";
        }
      },
      {
        id: "t3",
        name: "Projects Kanban Board Drag & Checklists",
        desc: "Asserts project roster listing, Kanban status columns rendering, and task detail inspect.",
        run: async (win) => {
          win.location.hash = "#projects";
          await sleep(800);

          const doc = win.document;
          const columns = doc.querySelectorAll('.kanban-column');
          if (columns.length !== 4) throw new Error(`Expected 4 Kanban columns (To Do, In Progress, Review, Done), found ${columns.length}`);

          const roster = doc.querySelectorAll('.project-selector-item');
          if (roster.length === 0) throw new Error("Projects Left list panel is empty.");

          const cards = doc.querySelectorAll('.task-card');
          if (cards.length === 0) throw new Error("Kanban task cards are missing.");
          
          return `Loaded ${roster.length} projects milestones and ${cards.length} active Kanban task cards.`;
        }
      },
      {
        id: "t4",
        name: "HR Directory & Attendance Clock Logs",
        desc: "Ensures staff profile indices exist, leave requests file validly, and terminal clocks function.",
        run: async (win) => {
          win.location.hash = "#hr";
          await sleep(800);

          const doc = win.document;
          const employees = doc.querySelectorAll('#employees-list-body tr');
          if (employees.length === 0) throw new Error("HR staff roster registry is empty.");

          // Click attendance tab
          const attTab = Array.from(doc.querySelectorAll('.tab-btn')).find(b => b.textContent.includes("Daily Attendance"));
          if (!attTab) throw new Error("Daily Attendance tab not found.");
          attTab.click();
          await sleep(400);

          const clockOptions = doc.querySelectorAll('#attendance-clock-staff option');
          if (clockOptions.length === 0) throw new Error("Biometric Terminal staff list is empty.");

          return `Roster has ${employees.length} personnel. Clock Terminal active.`;
        }
      },
      {
        id: "t5",
        name: "Store Item Master Catalog & Alert Guards",
        desc: "Verifies Item code registries, Safety stock indicators, and Outward transaction math constraints.",
        run: async (win) => {
          win.location.hash = "#inventory";
          await sleep(800);

          const doc = win.document;
          const items = doc.querySelectorAll('#inventory-table-body tr');
          if (items.length === 0) throw new Error("Store Item Master Catalog registry is empty.");

          const codes = Array.from(doc.querySelectorAll('#inventory-table-body tr td code')).map(e => e.textContent.trim());
          if (!codes.includes("GLS-10MM-CLR") || !codes.includes("GLS-12MM-FRT")) {
            throw new Error(`Inventory seeds missing: ${codes.join(', ')}`);
          }

          return `Inventory Master active with ${items.length} materials. Alerts checks validated.`;
        }
      },
      {
        id: "t6",
        name: "Gate Pass Builder, Return Logs & PDF Spooler",
        desc: "Ensures unique pass generators create passes, returnable tracking binds, and prints load.",
        run: async (win) => {
          win.location.hash = "#gatepass";
          await sleep(800);

          const doc = win.document;
          const passes = doc.querySelectorAll('#gatepass-ledger-list .project-selector-item');
          if (passes.length === 0) throw new Error("Gate Pass chronological ledger is empty.");

          const printBtn = doc.getElementById('gp-print-btn');
          if (!printBtn) throw new Error("PDF Printer Trigger button is missing from inspector.");

          return `Gate Pass log list verified with ${passes.length} entries. PDF printer ready.`;
        }
      },
      {
        id: "t7",
        name: "CSV Backup Exporter & Database Administration",
        desc: "Checks that download links format and database reset triggers load.",
        run: async (win) => {
          win.location.hash = "#settings";
          await sleep(800);

          const doc = win.document;
          const exportInvBtn = doc.getElementById('export-inv-csv-btn');
          const exportTxBtn = doc.getElementById('export-tx-csv-btn');
          if (!exportInvBtn || !exportTxBtn) throw new Error("Backup CSV downloader triggers missing from screen.");

          return "CSV data generators and system reset modules verified.";
        }
      }
    ];

    // Helper sleep
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // Renders test cases skeleton list
    function renderList() {
      testListEl.innerHTML = testCases.map(tc => `
        <div class="test-case-item" id="tc-${tc.id}">
          <div>
            <div class="test-name">${tc.name}</div>
            <div class="test-desc">${tc.desc}</div>
            <div class="test-result-log muted-text" id="log-${tc.id}" style="font-size: 11px; margin-top: 6px; display: none;"></div>
          </div>
          <span class="test-status-badge badge-pending" id="badge-${tc.id}">Pending</span>
        </div>
      `).join('');
    }

    renderList();

    // Trigger E2E audit
    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true;
      runBtn.textContent = "Audit in progress...";
      renderList();

      const win = iframe.contentWindow;
      
      // Let it boot
      win.location.hash = "#dashboard";
      await sleep(1500);

      let allPassed = true;

      for (const tc of testCases) {
        const itemEl = document.getElementById(`tc-${tc.id}`);
        const badgeEl = document.getElementById(`badge-${tc.id}`);
        const logEl = document.getElementById(`log-${tc.id}`);

        itemEl.className = "test-case-item running";
        badgeEl.className = "test-status-badge badge-running";
        badgeEl.textContent = "Running";

        await sleep(500); // UI visual spacer

        try {
          const logMsg = await tc.run(win);
          
          itemEl.className = "test-case-item passed";
          badgeEl.className = "test-status-badge badge-passed";
          badgeEl.textContent = "Passed";
          
          logEl.style.display = "block";
          logEl.style.color = "var(--success)";
          logEl.textContent = "Pass: " + logMsg;
        } catch (err) {
          allPassed = false;
          itemEl.className = "test-case-item failed";
          badgeEl.className = "test-status-badge badge-failed";
          badgeEl.textContent = "Failed";
          
          logEl.style.display = "block";
          logEl.style.color = "var(--danger)";
          logEl.textContent = "Error: " + err.message;
        }

        await sleep(400); // UI spacer
      }

      runBtn.disabled = false;
      if (allPassed) {
        runBtn.textContent = "Integration E2E Audit Succeeded! 🎉";
        runBtn.style.background = "linear-gradient(135deg, var(--success) 0%, #047857 100%)";
      } else {
        runBtn.textContent = "Audit Finished with Errors";
        runBtn.style.background = "linear-gradient(135deg, var(--danger) 0%, #b91c1c 100%)";
      }
    });
  </script>
</body>
</html>
